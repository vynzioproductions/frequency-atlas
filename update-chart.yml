name: Weekly chart update

on:
  schedule:
    - cron: '23 16 * * 6'   # every Saturday, 9:23 AM Arizona time
  workflow_dispatch:         # lets you run it any time from the Actions tab
  push:
    paths: ['playlists/**']  # re-run when you upload new playlist exports

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild song library from playlists
        run: node scripts/build-library.mjs
      - name: Pull this week's Spotify US chart
        run: node scripts/update-chart.mjs
      - name: Publish changes
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add library.js auto.js
          git diff --cached --quiet || (git commit -m "Weekly chart update" && git push)
