name: Add shared station

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  add:
    # your own requests go straight on the air; other people's wait until you add the "approved" label
    if: >-
      startsWith(github.event.issue.title, 'Station:') &&
      ((github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner) ||
       (github.event.action == 'labeled' && github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the station and add it
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/add-station.mjs
      - name: Publish
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add stations.json
          git diff --cached --quiet || (git commit -m "Add shared station" && git pull --rebase && git push)
      - name: Tell them it's on the air
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "📻 $(cat /tmp/station-added.txt) is on the air for everyone. It shows up on the map within a few minutes."
      - name: Explain what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "Couldn't add this station: $(cat /tmp/station-error.txt 2>/dev/null || echo 'something went wrong.') Fix it in the app and share it again."
