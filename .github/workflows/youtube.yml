name: Daily update

on:
  schedule:
    - cron: '41 9 * * *'   # every day, 2:41 AM Arizona time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the US New Music Chart
        run: node scripts/update-composite.mjs
      - name: Find YouTube videos for songs (about 95 a day)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube-ids.mjs
      - name: Publish changes
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add composite.js composite-history.json yt.js
          git diff --cached --quiet || (git commit -m "Daily update" && git pull --rebase && git push)
